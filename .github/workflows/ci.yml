# Pipeline GitHub Actions, équivalent de .gitlab-ci.yml.
#  - check   : syntaxe JS et JSON, mêmes clés de traduction dans toutes les langues
#  - package : zip de l'extension en artefact (sonnuage-extension-X.Y.Z.zip). Sur tag vX.Y.Z (créé par semantic-release
#              sur GitLab, puis recopié par le miroir), la version du tag est écrite dans le manifeste.
#  - release : sur tag vX.Y.Z, release GitHub avec le zip. v0.0.0 marque seulement le point de départ des versions.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for f in *.js; do node --check "$f"; done
      - run: |
          node -e '
            const fs = require("fs");
            JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const langs = fs.readdirSync("_locales");
            const keys = l => Object.keys(JSON.parse(fs.readFileSync(`_locales/${l}/messages.json`, "utf8"))).sort().join();
            const ref = keys("en");
            for (const l of langs) if (keys(l) !== ref) { console.error(`_locales/${l} : clés différentes de en`); process.exit(1); }
            console.log(`manifest OK, langues : ${langs.join(", ")}`);
          '

  package:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.ref_type == 'tag'
        run: node -e 'const fs = require("fs"); const m = JSON.parse(fs.readFileSync("manifest.json", "utf8")); m.version = process.argv[1]; fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2));' "${GITHUB_REF_NAME#v}"
      - run: |
          v=$(node -p 'require("./manifest.json").version')
          mkdir -p dist
          zip -r -X "dist/sonnuage-extension-$v.zip" manifest.json *.js *.html *.css _locales icons
          unzip -l "dist/sonnuage-extension-$v.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sonnuage-extension
          path: dist/
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/tags/v0.0.0'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sonnuage-extension
          path: dist
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Extension SonNuage ${GITHUB_REF_NAME#v}"
