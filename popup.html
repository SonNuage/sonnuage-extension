<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SonNuage</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="logo" src="icons/logo.svg" alt="" />
      <span data-i18n="extName"></span>
    </div>
    <button id="settings" class="icon" type="button" data-i18n-title="popupSettings" data-i18n-aria="popupSettings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54a7.4 7.4 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z" /></svg>
    </button>
  </header>

  <main id="main">
    <section id="empty" class="card" hidden>
      <p data-i18n="popupNoServer"></p>
      <button id="configure" type="button" data-i18n="popupConfigure"></button>
    </section>

    <section id="server" class="card server" hidden>
      <div class="server-row">
        <div class="server-id">
          <select id="serverSelect" data-i18n-title="popupTargetServer" data-i18n-aria="popupTargetServer" hidden></select>
          <strong id="serverName"></strong>
          <span id="serverHost" class="muted"></span>
        </div>
        <span id="badge" class="badge"></span>
      </div>
      <div id="serverError" class="msg bad" hidden></div>
    </section>

    <div id="actions"></div>

    <section id="cookies" class="card cookies" hidden>
      <div class="kicker" data-i18n="popupCookies"></div>
      <div id="cookieText" class="small"></div>
      <button id="cookiesNow" class="secondary" type="button" data-i18n="btnSendCookiesNow"></button>
      <div id="cookieMsg" class="msg" hidden></div>
    </section>
  </main>

  <footer class="bottom">
    <span id="version" class="muted"></span>
    <button id="footerSettings" class="link" type="button" data-i18n="popupSettings"></button>
  </footer>

  <script src="ui.js"></script>
  <script src="page-info.js"></script>
  <script src="popup.js"></script>
</body>
</html>
