# Pipeline de l'extension SonNuage
#  - package : syntaxe JS et JSON, mêmes clés de traduction dans toutes les langues, puis zip de l'extension en
#              artefact (dist/sonnuage-extension-X.Y.Z.zip, version du manifeste). Un seul job : un seul démarrage.
#  - release : sur main, semantic-release choisit la version et crée le tag vX.Y.Z et sa release. Le pipeline du
#              tag écrit cette version dans le manifeste et joint le zip à la release

stages: [package, release]

variables:
  GIT_DEPTH: "10"
  FF_USE_FASTZIP: "true"

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

package:
  stage: package
  image: node:22-alpine
  script:
    - for f in *.js; do node --check "$f"; done
    - |
      node -e '
        const fs = require("fs");
        JSON.parse(fs.readFileSync("manifest.json", "utf8"));
        const langs = fs.readdirSync("_locales");
        const keys = l => Object.keys(JSON.parse(fs.readFileSync(`_locales/${l}/messages.json`, "utf8"))).sort().join();
        const ref = keys("en");
        for (const l of langs) if (keys(l) !== ref) { console.error(`_locales/${l} : clés différentes de en`); process.exit(1); }
        console.log(`manifest OK, langues : ${langs.join(", ")}`);
      '
    # Sur tag, la version vient de semantic-release : elle est écrite dans le manifeste du paquet.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        node -e 'const fs = require("fs"); const m = JSON.parse(fs.readFileSync("manifest.json", "utf8")); m.version = process.argv[1]; fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2));' "${CI_COMMIT_TAG#v}"
      fi
    - apk add --no-cache zip > /dev/null
    - VERSION=$(node -p 'require("./manifest.json").version')
    - mkdir -p dist
    - zip -r -X "dist/sonnuage-extension-$VERSION.zip" manifest.json *.js *.html *.css _locales icons
    - unzip -l "dist/sonnuage-extension-$VERSION.zip"
  artifacts:
    name: sonnuage-extension
    paths: [dist/]
    expire_in: 30 days

# Version suivante d'après les messages de commit (Conventional Commits : feat → mineure, fix → correctif,
# « ! » ou BREAKING CHANGE → majeure), tag vX.Y.Z et release GitLab avec ses notes. Le tag relance un pipeline
# qui publie la version. GITLAB_TOKEN : jeton du groupe sonnuage (variable masquée et protégée).
semantic-release:
  stage: release
  image: node:22-alpine
  needs: [package]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  variables:
    # Tout l'historique et les tags : la version se déduit des commits depuis le dernier tag.
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git > /dev/null
    - npx --yes -p semantic-release@25.0.9 -p @semantic-release/gitlab@13.3.3 -p conventional-changelog-conventionalcommits@9.3.1 semantic-release

# Sur tag (créé par semantic-release, avec sa release) : fichiers dans le registre de paquets génériques et liens
# dans la release. Les tags v* sont protégés : GITLAB_TOKEN y est disponible.
release-assets:
  stage: release
  image: alpine:3.22
  needs: [package]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/ && $CI_COMMIT_TAG != "v0.0.0"
  script:
    - apk add --no-cache curl > /dev/null
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      for f in dist/*; do
        name=$(basename "$f")
        url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sonnuage-extension/${VERSION}/${name}"
        curl --fail -sS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$url" > /dev/null
        curl --fail -sS --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --data-urlencode "name=$name" --data-urlencode "url=$url"           --data "link_type=package" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links" > /dev/null
        echo "$name"
      done
