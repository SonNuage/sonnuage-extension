# Pipeline de l'extension SonNuage
#  - test    : syntaxe JS et JSON, mêmes clés de traduction dans toutes les langues
#  - package : zip de l'extension en artefact (dist/sonnuage-extension-X.Y.Z.zip, version du manifeste)
#  - release : sur tag vX.Y.Z, zip dans le registre de paquets génériques et release GitLab

stages: [test, package, release]

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

check:
  stage: test
  image: node:22-alpine
  script:
    - for f in *.js; do node --check "$f"; done
    - |
      node -e '
        const fs = require("fs");
        JSON.parse(fs.readFileSync("manifest.json", "utf8"));
        const langs = fs.readdirSync("_locales");
        const keys = l => Object.keys(JSON.parse(fs.readFileSync(`_locales/${l}/messages.json`, "utf8"))).sort().join();
        const ref = keys("en");
        for (const l of langs) if (keys(l) !== ref) { console.error(`_locales/${l} : clés différentes de en`); process.exit(1); }
        console.log(`manifest OK, langues : ${langs.join(", ")}`);
      '
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        MANIFEST_VERSION=$(node -p 'require("./manifest.json").version')
        [ "${CI_COMMIT_TAG#v}" = "$MANIFEST_VERSION" ] || { echo "Tag $CI_COMMIT_TAG ≠ version du manifeste $MANIFEST_VERSION" >&2; exit 1; }
      fi

package:
  stage: package
  image: node:22-alpine
  needs: [check]
  script:
    - apk add --no-cache zip > /dev/null
    - VERSION=$(node -p 'require("./manifest.json").version')
    - mkdir -p dist
    - zip -r -X "dist/sonnuage-extension-$VERSION.zip" manifest.json *.js *.html *.css _locales icons
    - unzip -l "dist/sonnuage-extension-$VERSION.zip"
  artifacts:
    name: sonnuage-extension
    paths: [dist/]
    expire_in: 30 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [package]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - apk add --no-cache curl > /dev/null
    - ZIP_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sonnuage-extension/${VERSION}/sonnuage-extension-${VERSION}.zip"
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "dist/sonnuage-extension-$VERSION.zip" "$ZIP_URL"'
    - >
      release-cli create --name "Extension SonNuage $VERSION" --tag-name "$CI_COMMIT_TAG"
      --assets-link "{\"name\":\"sonnuage-extension-$VERSION.zip\",\"url\":\"$ZIP_URL\",\"link_type\":\"package\"}"
